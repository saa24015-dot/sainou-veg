<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野菜パクパクゲーム 🍅 🍆</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ゲーム画面専用の追加レイアウト */
        .game-page-container {
            max-width: 500px;
            margin: 40px auto;
            text-align: center;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .game-instruction {
            font-size: 0.9rem;
            color: #6b6657;
            margin-bottom: 15px;
        }
        .score-board {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        .canvas-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto;
        }
        #gameCanvas {
            background: #2b2d42;
            border-radius: 10px;
            display: block;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .game-over-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(43, 45, 66, 0.9);
            border-radius: 10px;
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .game-over-screen h3 {
            font-size: 2rem;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="game-page-container">
        <a href="index.html" class="back-link" style="margin-left: 0; display: inline-block; margin-bottom: 15px;">← トマト王国に戻る</a>
        
        <h2>🐛 野菜パクパクゲーム 🍅 🍆</h2>
        <p class="game-instruction">矢印キー（↑ ↓ ← →）で操作。食べるほど加速するぞ！</p>
        
        <div class="score-board">
            スコア: <span id="game-score">0</span>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="game-over-screen" class="game-over-screen">
                <h3>ゲームオーバー！</h3>
                <p>スコア: <span id="final-score">0</span></p>
                <button id="restart-game-btn" class="btn">もう一度遊ぶ</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('game-score');
        const finalScoreEl = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const restartBtn = document.getElementById('restart-game-btn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake, dx, dy, food, score, isGameOver;
        let currentSpeed; // 現在の速度（ミリ秒）
        let gameTimeoutId; // setTimeoutを管理するID

        const START_SPEED = 250; // 【最初のおおらかな速度（0.25秒に1マス移動）】
        const MAX_SPEED = 60;    // 【最高速度の限界（これ以上は早くならない）】
        const SPEED_UP_STEP = 10.5; // 【野菜を1個食べるごとに15ミリ秒スピードアップ】

        const emojis = ['🍅', '🍆', '🍅', '🍆'];

        function initGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            currentSpeed = START_SPEED; // 初速をセット
            isGameOver = false;
            scoreEl.innerText = score;
            gameOverScreen.style.display = 'none';
            spawnFood();
            
            if(gameTimeoutId) clearTimeout(gameTimeoutId);
            gameLoop(); // ループ開始
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount),
                type: emojis[Math.floor(Math.random() * emojis.length)]
            };
            snake.forEach(part => {
                if(part.x === food.x && part.y === food.y) spawnFood();
            });
        }

        // 食べるごとに速度が変化するため、setIntervalからsetTimeoutのループに変更
        function gameLoop() {
            if (isGameOver) return;

            updateGame();
            
            // 次のフレームまでの時間を「currentSpeed」でコントロール
            gameTimeoutId = setTimeout(gameLoop, currentSpeed);
        }

        function updateGame() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || checkSelfCollision(head)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                
                // 【ここがポイント：野菜を食べたらスピードを上げる（時間を縮める）】
                if (currentSpeed > MAX_SPEED) {
                    currentSpeed -= SPEED_UP_STEP;
                }
                
                spawnFood();
            } else {
                snake.pop();
            }

            drawGrid();
        }

        function checkSelfCollision(head) {
            return snake.some((part, index) => index !== 0 && part.x === head.x && part.y === head.y);
        }

        function drawGrid() {
            ctx.fillStyle = '#2b2d42';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // エサ
            ctx.font = "16px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(food.type, food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2);

            // ミミズ
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#1a665b' : '#2a9d8f';
                ctx.beginPath();
                ctx.arc(part.x * gridSize + gridSize/2, part.y * gridSize + gridSize/2, gridSize/2 - 1, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function endGame() {
            isGameOver = true;
            clearTimeout(gameTimeoutId);
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        window.addEventListener('keydown', e => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
            switch(e.key) {
                case 'ArrowUp':    if (dy === 0) { dx = 0; dy = -1; } break;
                case 'ArrowDown':  if (dy === 0) { dx = 0; dy = 1; } break;
                case 'ArrowLeft':  if (dx === 0) { dx = -1; dy = 0; } break;
                case 'ArrowRight': if (dx === 0) { dx = 1; dy = 0; } break;
            }
        });

        restartBtn.addEventListener('click', initGame);
        
        // ページを開いた瞬間にゲームを開始
        initGame();
    </script>
</body>
</html>
