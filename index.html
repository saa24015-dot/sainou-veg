<!DOCTYPE html>
<!-- =========================================================
     index.html  ―― サイトの入口（トップページ）
     👤 担当：構成リーダー（　小石蓮人　）さん

     このページは「お店の入口」です。
     ・上に大きな写真（ヒーロー）
     ・下に作物カードを並べる
     カードをクリックすると、各作物のページに移動します。
     新しい作物を追加するときは、下の <a class="card"> ... </a> を
     1つコピーして、リンク先・写真・名前を変えればOK。
     ========================================================= -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✏️ ブラウザのタブに出る名前。学校・農場の名前に変えよう -->
  <title>西条農業高校 直売所サイト</title>

  <!-- 見た目を読み込む（さわらなくてOK） -->
  <link rel="stylesheet" href="style.css">
  <!-- フォント（さわらなくてOK） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- ▼ 上の帯（全ページ共通）✏️ 農場名を変えよう -->
  <header class="site-header">
    <div class="farm-name">🌱 西条農業高校 直売所</div>
    <div class="farm-sub">わたしたちが育てた作物を紹介します</div>
  </header>

  <!-- ▼ ヒーロー（一番上の大きな写真）✏️ images/hero.jpg を自分たちの写真に -->
  <section class="hero">
    <img src="images/sainougazou.jpg" alt="学校農場の写真">
    <div class="hero-text">
      <h1>畑から、まっすぐ。</h1>
      <p>３年ｓ組で育てました</p>
    </div>
  </section>
 <p class="center-text">日にち　毎週木曜日　午前１０時から午前１２時まで（なくなり次第終了）</p>
     <p class="center-text">お支払いは現金のみです</p>
     
  <!-- ▼ ここから作物の一覧 -->
  <main class="container">
    <h2 class="section-title">今日のおすすめ</h2>
    <p class="lead">気になる作物をタップしてみてください</p>

    <div class="card-grid">

      <!-- ===== カード1：トマト（見本ページにリンク）===== -->
      <a class="card" href="tomato.html">
        <img src="images/tomato.jpg" alt="トマト">
          
        <div class="card-body">
          <span class="tag">完熟</span>
          <h3>あま～いトマト</h3>
          <p>朝もぎたて。生でガブッといけます。</p>
        </div>
      </a>

      <!-- ===== カード2：あなたの作物（コピーして増やせる）===== -->
      <!-- ✏️ href を作ったページ名に、img を写真に、文章を自分の言葉に -->
      <a class="card" href="template-product.html">
        <img src="images/nasu.jpg" alt="作物の名前">
           
        <div class="card-body">
          <span class="tag">伝統野菜</span>
          <h3>ナス</h3>
          <p>「水の都」西条の湧き水をふんだんに使って育てた伝統野菜！</p>
        </div>
      </a>

      <!-- ===== カード3：コピー用の見本（増やすときはこれを複製）===== -->
      <a class="card" href="template-product.html">
        <img src="images/photo.jpg" alt="作物の名前">
        <div class="card-body">
          <span class="tag">タグ</span>
          <h3>作物の名前</h3>
          <p>ひとことアピール（20文字くらい）</p>
        </div>
      </a>

    </div>
  </main>

  <!-- ▼ 下の帯（全ページ共通）✏️ 学校名・年などを入れよう -->
  <footer class="site-footer">
    © 2026 西条農業高校 ／ 農業情報活用の授業で作りました
  </footer>

<script>
        // 降らせたい絵文字のリスト
        const emojis = ['🍅', '🍆', '🍅', '🍆']; 

        function createDrop() {
            const drop = document.createElement('div');
            
            // ランダムにトマトかナスを選ぶ
            drop.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // 基本のスタイルを設定
            drop.style.position = 'fixed';
            drop.style.left = Math.random() * 100 + 'vw'; // 左右ランダムな位置
            drop.style.fontSize = (Math.random() * 20 + 20) + 'px'; // 大きさ（20px〜40px）
            drop.style.zIndex = '9999'; // 一番手前に表示
            drop.style.pointerEvents = 'none'; // クリックの邪魔をしない
            drop.style.userSelect = 'none'; // 文字選択されないようにする
            
            // スタート位置（画面のすぐ上）
            let posY = -50;
            drop.style.top = posY + 'px';
            
            // クルクル回すための角度
            let angle = 0;
            const spinSpeed = Math.random() * 4 - 2; // 回転速度と方向をランダムに
            
            document.body.appendChild(drop);

            // 落ちるスピードをランダムに設定（数値が大きいほど速い）
            const fallSpeed = Math.random() * 3 + 2; 

            // パラパラと下に動かすタイマー処理
            const timer = setInterval(() => {
                posY += fallSpeed; // 下に移動
                angle += spinSpeed; // 回転
                
                drop.style.top = posY + 'px';
                drop.style.transform = `rotate(${angle}deg)`;
                
                // 画面の一番下（ウィンドウの高さ）を超えたら消去する
                if (posY > window.innerHeight) {
                    clearInterval(timer);
                    drop.remove();
                }
            }, 20); // 0.02秒ごとに少しずつ動かす
        }

        // 0.4秒（400ミリ秒）ごとに1個降らせる
        setInterval(createDrop, 400);
    </script>
    ```


</body>
</html>
